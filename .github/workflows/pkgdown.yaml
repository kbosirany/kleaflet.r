# Template kpkg.r 0.1.0.9000: github/pkgdown.yaml
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
#
# The site of the main branch is published at the root of GitHub Pages and
# the site of the dev branch in /dev. Both live on the gh-pages branch:
# deployments use `clean: false` so that one never deletes the other.
on:
  push:
    branches: [main, dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deployment at a time, so main and dev never race on gh-pages
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # "devel" builds into docs/dev/, "release" into docs/
      PKGDOWN_DEV_MODE: ${{ github.ref_name == 'dev' && 'devel' || 'release' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Quarto CLI, to render the books of `reports/`
      - uses: quarto-dev/quarto-actions/setup@v2
        if: hashFiles('reports/*/_quarto.yml') != ''

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website

      # Builds the site and renders the reports of `reports/` in it
      - name: Build site
        run: Rscript dev/build_site.R

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
